# Candidate models for the Ukrainian benchmark (seeds Open Question 3).
# `make prep-models` reads this: it detects the host GPU, pulls the Ollama tags, and
# snapshot-caches the vLLM (Hugging Face) weights once. `make list-models` estimates fit.
#
#   backend:     ollama (managed store) | vllm (HF weights) | llamacpp (HF GGUF)
#   source:      Ollama tag | Hugging Face repo id | hf.co/<GGUF-repo>:<quant>
#   min_vram_gb: rough floor to SERVE the model at a sane context on this hardware class
#                (used only to skip/flag oversized models; the real fit test is a launch)
#
# Repo ids below were taken from the linked HF collections (verified live):
#   Gemma 4            https://huggingface.co/collections/google/gemma-4
#   Gemma 4 QAT Q4_0   https://huggingface.co/collections/google/gemma-4-qat-q4-0
#   Qwen3.8            https://huggingface.co/Qwen/Qwen3.8-27B (current Qwen generation)
#   Qwen3.6            https://huggingface.co/collections/Qwen/qwen36 (previous generation)
#   MamayLM v2.0       https://huggingface.co/collections/INSAIT-Institute/mamaylm-v20-gemma-3
#
# Notes that shape these picks for a 16 GB RTX 4060 Ti:
#  - LICENSE / GATING: none of the artifacts below are gated. Gemma 4, Qwen, and Mistral use
#    Apache-2.0; the Ukrainian Gemma 3 derivatives use the Gemma license. Every logical model
#    records `license` + `license_url`. To add a GATED model (e.g. a
#    Gemma 2/3 or Llama repo) set `gated: true` + `license_url: <hf-page>` on the entry;
#    `prep-models` then prints the acceptance link (and does so automatically when a download
#    hits a gate). See the commented example at the end of this file.
#  - QAT formats: the gemma-4-qat-q4-0 collection ships `-w4a16-ct` (int4 for vLLM, used
#    here), `-gguf` (Ollama/llama.cpp), and `-unquantized` (bf16). On 16 GB, only the int4
#    Gemma-4 fits vLLM in VRAM; the larger bf16/FP8 models below are offload/bigger-GPU
#    candidates (vLLM does not split layers to CPU the way llama.cpp does -- for those,
#    prefer the GGUF variant on Ollama; see the comment block at the end).
#  - These are multimodal (image-text); we serve + score TEXT only.
#  - Gemma 3/4 use sliding-window attention, so `list-models` over-estimates KV cache at
#    long context (its feasible-context numbers are conservative for these models).
#  - w4a16 / fp8 WEIGHTS keep the embedding (and Gemma 3n Per-Layer Embeddings) high-precision
#    while quantizing only the linear layers, so a flat `params_b x bpw` under-counts. The
#    planner is now EMBEDDING-AWARE (M4.1): it prices the high-precision mass at 16-bit from the
#    `vocab_size` / `hidden_size` / `tie_word_embeddings` (or `hi_precision_params_b`) fields
#    below. Anchor: gemma-4-E4B-it-w4a16 MEASURED 9.8 GiB weights (M2.4, RTX 4060 Ti); the
#    estimate now lands there instead of the old ~4.2 GiB. GGUF k-quants quantize the embedding
#    too, so the premium does NOT apply to Ollama/llama.cpp q4_k_m sources.
#
# Planning fields (used by `make list-models`; arch values also auto-read from each config.json):
#   params_b  billions   quant  bpw class (bf16, fp8, w4a16, q4_k_m, ...)  n_layers
#   kv_dim    n_kv_heads * head_dim    max_context  model max window
#   vocab_size / hidden_size / tie_word_embeddings  embedding-aware weights (M4.1; partial
#     quants only).  hi_precision_params_b  override (billions of params kept at 16-bit) for
#     non-vocab high-precision mass such as Gemma 3n Per-Layer Embeddings.
#
# Runtime floor fields (per source record; used by the resolver and `prep-models`):
#   runtime_arch          the architecture id the serving runtime must implement (`gemma4`)
#   min_runtime_version   the first runtime version that implements it. Read it from the artifact
#     itself -- `ollama show <tag>` prints `requires` -- and never guess: a source below the floor
#     is reported as a NAMED skip naming the runtime and the version, instead of failing at load
#     with `unknown model architecture`. Ollama also declares the floor per held tag, so this pin
#     is what covers a tag that is not pulled yet and a raw GGUF, which declares nothing.

# Family register (capability `model-roster-currency`): the sweep carries FAMILIES, not tags.
# Each family names its generations; exactly one is `current` and a superseded one is kept as
# `previous` only while a model below still serves from it. `upstream` records where a currency
# check reads the family (Ollama library namespace, Hugging Face author + repo prefix) so the
# probe never has to guess a naming scheme. The published family/licence tables in README.md and
# docs/reference/model-families.md are GENERATED from this block plus the `family` / `generation`
# fields on every model -- run `make sync-model-family-docs` after editing either.
families:
  - id: mamaylm
    label: MamayLM (INSAIT)
    role: ua-specialized
    focus: Ukrainian-specialized; the UA-tuned reference the baselines must beat
    upstream:
      hf_author: INSAIT-Institute
      hf_prefix: MamayLM
      ollama_namespace: hf.co/INSAIT-Institute
    generations:
      - id: v2.0
        status: current
        label: MamayLM v2.0 (Gemma 3)
        license: Gemma
        license_url: https://ai.google.dev/gemma/terms
        weights_url: https://huggingface.co/collections/INSAIT-Institute/mamaylm-v20-gemma-3

  - id: lapa
    label: Lapa (lang-uk)
    role: ua-specialized
    focus: Ukrainian-specialized; a second, independently tuned UA lineage
    upstream:
      hf_author: lapa-llm
      hf_prefix: lapa
      ollama_namespace: hf.co/lapa-llm
    generations:
      - id: v0.1.2
        status: current
        label: Lapa v0.1.2 instruct
        license: Gemma
        license_url: https://ai.google.dev/gemma/terms
        weights_url: https://huggingface.co/lapa-llm/lapa-v0.1.2-instruct

  - id: gemma
    label: Gemma (Google)
    role: multilingual-baseline
    focus: Multilingual baseline; the shared architecture the UA models derive from
    upstream:
      hf_author: google
      hf_prefix: gemma
      ollama_namespace: gemma
    generations:
      - id: "4"
        status: current
        label: Gemma 4
        license: Apache-2.0
        license_url: https://www.apache.org/licenses/LICENSE-2.0
        weights_url: https://huggingface.co/collections/google/gemma-4

  - id: qwen
    label: Qwen (Alibaba)
    role: multilingual-baseline
    focus: Multilingual baseline; the MoE lane that serves on every tier
    upstream:
      hf_author: Qwen
      hf_prefix: Qwen
      ollama_namespace: qwen
    generations:
      - id: "3.8"
        status: current
        label: Qwen3.8
        license: Apache-2.0
        license_url: https://www.apache.org/licenses/LICENSE-2.0
        weights_url: https://huggingface.co/Qwen/Qwen3.8-27B
      - id: "3.6"
        status: previous
        label: Qwen3.6
        license: Apache-2.0
        license_url: https://www.apache.org/licenses/LICENSE-2.0
        weights_url: https://huggingface.co/collections/Qwen/qwen36
      - id: "3"
        status: previous
        label: Qwen3
        license: Apache-2.0
        license_url: https://www.apache.org/licenses/LICENSE-2.0
        weights_url: https://huggingface.co/Qwen/Qwen3-30B-A3B

  - id: mistral
    label: Mistral Small (Mistral AI)
    role: multilingual-baseline
    focus: Multilingual baseline; a non-Gemma, non-Qwen dense control
    upstream:
      hf_author: mistralai
      hf_prefix: Mistral-Small
      ollama_namespace: mistral-small
    generations:
      - id: "3.1"
        status: current
        label: Mistral Small 3.1
        license: Apache-2.0
        license_url: https://www.apache.org/licenses/LICENSE-2.0
        weights_url: https://huggingface.co/mistralai/Mistral-Small-3.1-24B-Instruct-2503

models:
  # --- Gemma 4 int4 (w4a16) via vLLM -- candidates that fit a 16 GB card. ---
  - name: gemma-4-e4b-it-w4a16
    family: gemma
    generation: "4"
    backend: vllm
    source: google/gemma-4-E4B-it-qat-w4a16-ct
    min_vram_gb: 13    # weights load ~9.8 GiB; vLLM serving overhead makes this a 16 GiB target
    params_b: 8
    quant: w4a16
    n_layers: 42
    kv_dim: 512         # 2 KV heads * 256 head_dim
    max_context: 131072
    vocab_size: 262144
    tie_word_embeddings: true
    # token embedding + Gemma 3n Per-Layer Embeddings stay bf16 under w4a16; this override is
    # anchored to the MEASURED 9.8 GiB weights (M2.4), not vocab-derived (PLE is not in vocab).
    hi_precision_params_b: 4.2
    license: Apache-2.0
    license_url: https://huggingface.co/google/gemma-4-E4B-it-qat-w4a16-ct
    # M2.4 validated on the RTX 4060 Ti (vLLM 0.23.0, flashinfer sampler off): weights 9.8 GiB,
    # ~64 tok/s steady, peak VRAM 15.7 GB at gpu-memory-utilization 0.80, served ctx 8192,
    # cold load ~112 s, tokenizer ~0.33 tok/UA-char. The M2 reference real-backend run.
    notes: Gemma 4 ~8B int4 (w4a16, for vLLM); the M2.4 reference run -- fits 16 GB, not 12 GB
    sources:
      ollama:
        source: gemma4:e4b
        quant: q4_k_m
        min_vram_gb: 10
        runtime_arch: gemma4
        min_runtime_version: "0.20.0"   # `ollama show` -> requires
      llamacpp:
        source: hf.co/google/gemma-4-E4B-it-qat-q4_0-gguf:Q4_0
        quant: q4_0
        min_vram_gb: 10

  - name: gemma-4-12b-it-w4a16
    family: gemma
    generation: "4"
    backend: vllm
    source: google/gemma-4-12B-it-qat-w4a16-ct
    min_vram_gb: 10
    params_b: 12
    quant: w4a16
    n_layers: 48
    kv_dim: 2048        # 8 KV heads * 256 head_dim
    max_context: 262144
    vocab_size: 262144  # embedding-aware (M4.1): the 256k embedding stays bf16 under w4a16
    hidden_size: 3840
    tie_word_embeddings: true
    license: Apache-2.0
    license_url: https://huggingface.co/google/gemma-4-12B-it-qat-w4a16-ct
    notes: Gemma 4 12B int4; 12 GB works only at short vLLM context, 16 GB supports 8192
    # Runtime floors: `ollama show gemma4:12b` declares `requires 0.30.5` (the 12B architecture
    # landed in 0.30.3 and its x86/CUDA/Linux crash was fixed in 0.30.5). The first-party QAT GGUF
    # carries no `requires` field of its own, so it is pinned to the same floor -- Ollama 0.20
    # rejected it here with `unknown model architecture: 'gemma4'`.
    sources:
      ollama:
        source: gemma4:12b
        quant: q4_k_m
        min_vram_gb: 8
        runtime_arch: gemma4
        min_runtime_version: "0.30.5"
      llamacpp:
        source: hf.co/google/gemma-4-12B-it-qat-q4_0-gguf:Q4_0
        quant: q4_0
        min_vram_gb: 8
        runtime_arch: gemma4
        min_runtime_version: "0.30.5"

  # Gemma 4 26B-A4B is the strongest host-runnable addition backed by a public lang-uk result.
  # vLLM can use bf16 on a large tier or Red Hat's FP8 conversion on 32 GiB; 12/16 GiB uses the
  # first-party Ollama/GGUF Q4 artifact with CPU offload.
  - name: gemma-4-26b-a4b
    family: gemma
    generation: "4"
    backend: vllm
    source: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
    min_vram_gb: 30
    params_b: 25.2
    quant: fp8
    n_layers: 30
    kv_dim: 2048
    max_context: 262144
    vocab_size: 262144
    hidden_size: 2816
    tie_word_embeddings: true
    license: Apache-2.0
    license_url: https://huggingface.co/google/gemma-4-26B-A4B-it
    notes: Gemma 4 26B-A4B (~3.8B active), multilingual; public lang-uk reasoning result; 16 GiB uses Q4 offload
    sources:
      vllm:
        - source: google/gemma-4-26B-A4B-it
          quant: bf16
          min_vram_gb: 54
        - source: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
          quant: fp8
          min_vram_gb: 30
      ollama:
        source: gemma4:26b
        quant: q4_k_m
        min_vram_gb: 8
        runtime_arch: gemma4
        min_runtime_version: "0.20.0"   # `ollama show` -> requires
      llamacpp:
        source: hf.co/google/gemma-4-26B-A4B-it-qat-q4_0-gguf:Q4_0
        quant: q4_0
        min_vram_gb: 8

  # --- Larger current-gen candidates: offload or a bigger GPU on 16 GB (flagged by list-models). ---
  # Qwen3.8 is the CURRENT Qwen generation and the local default; the 3.6 entries below stay as the
  # previous generation so a Qwen result reads as a generation comparison, not a single point.
  - name: qwen3.8-27b
    family: qwen
    generation: "3.8"
    backend: vllm
    source: Qwen/Qwen3.8-27B-FP8
    min_vram_gb: 40
    params_b: 27.3
    quant: fp8
    n_layers: 64
    kv_layers: 16       # full_attention_interval 4: 16 of 64 layers own a growing KV cache
    kv_dim: 1024        # 4 KV heads * 256 head_dim
    max_context: 262144
    vocab_size: 248320
    hidden_size: 5120
    tie_word_embeddings: false
    license: Apache-2.0
    license_url: https://huggingface.co/Qwen/Qwen3.8-27B
    notes: Qwen3.8 dense 27B (qwen3_5 arch, hybrid linear/full attention); the current Qwen generation and the 16 GiB local default via the q4_k_m Ollama tag; needs Ollama >= 0.32.12 for the architecture
    sources:
      vllm:
        - source: Qwen/Qwen3.8-27B
          quant: bf16
          min_vram_gb: 58
        - source: Qwen/Qwen3.8-27B-FP8
          quant: fp8
          min_vram_gb: 40
      ollama:
        source: qwen3.8:27b
        quant: q4_k_m
        min_vram_gb: 8
        runtime_arch: qwen35
        min_runtime_version: "0.32.12"  # `ollama show` -> requires
      llamacpp:
        source: hf.co/unsloth/Qwen3.8-27B-GGUF:Q4_K_M
        quant: q4_k_m
        min_vram_gb: 8

  - name: qwen3.6-27b
    family: qwen
    generation: "3.6"
    backend: vllm
    source: Qwen/Qwen3.6-27B-FP8
    min_vram_gb: 40
    params_b: 27
    quant: fp8
    n_layers: 64
    kv_layers: 16       # only every fourth layer has a growing full-attention KV cache
    kv_dim: 1024
    max_context: 262144
    vocab_size: 248320
    hidden_size: 5120
    tie_word_embeddings: false
    license: Apache-2.0
    license_url: https://huggingface.co/Qwen/Qwen3.6-27B
    notes: Qwen3.6 dense 27B, multilingual and Apache-2.0; official Q4 Ollama fallback is a 16 GiB offload target; FP8 needs more than 32 GiB after untied-embedding overhead
    sources:
      vllm:
        - source: Qwen/Qwen3.6-27B
          quant: bf16
          min_vram_gb: 58
        - source: Qwen/Qwen3.6-27B-FP8
          quant: fp8
          min_vram_gb: 40
      ollama:
        source: qwen3.6:27b
        quant: q4_k_m
        min_vram_gb: 8
      llamacpp:
        source: hf.co/unsloth/Qwen3.6-27B-GGUF:Q4_K_M
        quant: q4_k_m
        min_vram_gb: 8

  - name: qwen3.6-35b-a3b-fp8
    family: qwen
    generation: "3.6"
    backend: vllm
    source: Qwen/Qwen3.6-35B-A3B-FP8
    min_vram_gb: 40
    params_b: 36          # total weights held in memory; MoE activates ~3B per token
    quant: fp8
    n_layers: 40
    kv_layers: 10         # hybrid linear/full attention: every fourth layer owns growing KV
    kv_dim: 512           # 2 KV heads * 256 head_dim
    max_context: 262144
    vocab_size: 248320
    hidden_size: 2048
    tie_word_embeddings: false
    license: Apache-2.0
    license_url: https://huggingface.co/Qwen/Qwen3.6-35B-A3B
    notes: Qwen3.6 MoE (36B total / ~3B active) FP8; Apache-2.0; 16 GB uses the IQ3 Ollama fallback
    sources:
      vllm:
        - source: Qwen/Qwen3.6-35B-A3B
          quant: bf16
          min_vram_gb: 76
        - source: Qwen/Qwen3.6-35B-A3B-FP8
          quant: fp8
          min_vram_gb: 40
      ollama:
        - source: qwen3.6:35b
          quant: q4_k_m
          min_vram_gb: 8
        - source: batiai/qwen3.6-35b:iq3
          quant: iq3
          bpw: 3.5
          min_vram_gb: 8
      llamacpp:
        source: hf.co/unsloth/Qwen3.6-35B-A3B-GGUF:Q4_K_M
        quant: q4_k_m
        min_vram_gb: 8

  # --- Ollama-curated Qwen3 MoE baseline for the cross-tier best-model search: one tag that
  #     serves on EVERY CUDA tier (q4_k_m weights ~18.6 GiB -- VRAM-resident on 24/32 GB,
  #     CPU-offloaded via Ollama on 12/16 GB; vLLM has no equivalent single-artifact path).
  - name: qwen3-30b-a3b
    family: qwen
    generation: "3"
    backend: ollama
    source: qwen3:30b
    min_vram_gb: 8
    params_b: 30.5        # MoE total held in memory; ~3.3B active per token
    quant: q4_k_m
    n_layers: 48
    kv_dim: 512           # 4 KV heads * 128 head_dim
    max_context: 40960
    license: Apache-2.0
    license_url: https://huggingface.co/Qwen/Qwen3-30B-A3B
    notes: Qwen3 30B-A3B MoE q4_k_m (curated Ollama tag, Apache-2.0); hybrid thinking is ON by default -- disable it for scoring (Ollama native `think=false`), like gemma4
    sources:
      vllm:
        source: Qwen/Qwen3-30B-A3B
        quant: bf16
        min_vram_gb: 64
      llamacpp:
        source: hf.co/unsloth/Qwen3-30B-A3B-GGUF:Q4_K_M
        quant: q4_k_m
        min_vram_gb: 8

  - name: mistral-small-3.1-24b
    family: mistral
    generation: "3.1"
    backend: vllm
    source: RedHatAI/Mistral-Small-3.1-24B-Instruct-2503-quantized.w4a16
    min_vram_gb: 20
    params_b: 24          # 23.6B dense; rounded up so the quantized weight estimate stays honest
    quant: w4a16
    n_layers: 40
    kv_dim: 1024          # 8 KV heads * 128 head_dim (full attention -- no sliding window)
    max_context: 131072
    vocab_size: 131072    # embedding-aware (M4.1): the 131k embedding + UNTIED lm_head stay bf16
    hidden_size: 5120     # under w4a16, so a flat params_b x bpw under-counts the weights
    tie_word_embeddings: false
    license: Apache-2.0
    license_url: https://huggingface.co/mistralai/Mistral-Small-3.1-24B-Instruct-2503
    notes: Mistral Small 3.1 (24B, Apache-2.0, multilingual); vLLM fp8/w4a16 on 32/24 GiB, q4 GGUF below
    # Multi-quant vLLM (resolver-multi-quant-vllm): the resolver prices each vLLM quant and picks
    # the highest-quality one that fits the host on GPU -- fp8 (~24 GiB) on a 32 GiB card, w4a16
    # (~14 GiB) on a 24 GiB card -- then falls back to the curated GGUF on Ollama for 12/16 GiB.
    # Quants are ranked by bits-per-weight; arch fields are shared from this parent entry. Use
    # Ollama's CURATED `mistral-small3.1` tag (q4_k_m): the lmstudio/bartowski HF GGUF mirrors of
    # this checkpoint crash the Ollama 0.20 llama.cpp runner on load, while the curated tag is
    # tested against the runtime and serves the text path (we score text only).
    sources:
      vllm:
        - source: RedHatAI/Mistral-Small-3.1-24B-Instruct-2503-FP8-dynamic
          quant: fp8
          min_vram_gb: 30
        - source: RedHatAI/Mistral-Small-3.1-24B-Instruct-2503-quantized.w4a16
          quant: w4a16
          min_vram_gb: 20
      ollama:
        source: mistral-small3.1:24b
        quant: q4_k_m
        min_vram_gb: 8
      llamacpp:
        source: hf.co/unsloth/Mistral-Small-3.1-24B-Instruct-2503-GGUF:Q4_K_M
        quant: q4_k_m
        min_vram_gb: 8

  - name: mamaylm-v2-12b
    family: mamaylm
    generation: v2.0
    backend: vllm
    source: INSAIT-Institute/MamayLM-Gemma-3-12B-IT-v2.0
    min_vram_gb: 26
    params_b: 12
    quant: bf16
    n_layers: 48
    kv_dim: 2048        # 8 KV heads * 256 head_dim
    max_context: 131072
    license: Gemma
    license_url: https://huggingface.co/INSAIT-Institute/MamayLM-Gemma-3-12B-IT-v2.0
    notes: Ukrainian-specialized (Gemma-3-12B); on 16 GB the resolver picks the q4 GGUF (offload)
    # Per-source records (M3.2): the resolver prices each artifact with its OWN quant -- the bf16
    # vLLM weights do not fit 16 GB, but the q4_k_m GGUF runs on Ollama via CPU offload.
    sources:
      ollama:
        source: hf.co/INSAIT-Institute/MamayLM-Gemma-3-12B-IT-v2.0-GGUF:Q4_K_M
        quant: q4_k_m
        min_vram_gb: 8
      llamacpp:
        source: hf.co/INSAIT-Institute/MamayLM-Gemma-3-12B-IT-v2.0-GGUF:Q4_K_M
        quant: q4_k_m
        min_vram_gb: 8

  - name: mamaylm-v2-27b-fp8
    family: mamaylm
    generation: v2.0
    backend: vllm
    source: INSAIT-Institute/MamayLM-Gemma-3-27B-IT-v2.0-FP8-dynamic
    min_vram_gb: 30
    params_b: 27
    quant: fp8
    n_layers: 62
    kv_dim: 2048        # 16 KV heads * 128 head_dim
    max_context: 131072
    vocab_size: 262144  # embedding-aware (M4.1): embedding stays bf16 even in the fp8 checkpoint
    hidden_size: 5376
    tie_word_embeddings: true
    license: Gemma
    license_url: https://huggingface.co/INSAIT-Institute/MamayLM-Gemma-3-27B-IT-v2.0
    notes: Ukrainian-specialized 27B FP8; also a local-judge candidate (Premise 2); bigger GPU
    sources:
      ollama:
        source: hf.co/INSAIT-Institute/MamayLM-Gemma-3-27B-IT-v2.0-GGUF:Q4_K_M
        quant: q4_k_m
        min_vram_gb: 8
      llamacpp:
        source: hf.co/INSAIT-Institute/MamayLM-Gemma-3-27B-IT-v2.0-GGUF:Q4_K_M
        quant: q4_k_m
        min_vram_gb: 8

  - name: lapa-v0.1.2-instruct
    family: lapa
    generation: v0.1.2
    backend: vllm
    source: lapa-llm/lapa-v0.1.2-instruct
    min_vram_gb: 26
