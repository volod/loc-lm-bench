[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llb"
version = "0.1.0"
description = "loc-lm-bench: local Ukrainian LLM model-selection benchmark"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "huggingface-hub>=0.24",
  "httpx>=0.27",
  "openai>=1.40",
  "pymupdf4llm",
  # Ukrainian lemmatization and word-form validation are runtime retrieval behavior. Keep the
  # analyzer and dictionary in the base environment so comparison rows and tests never disappear.
  "pymorphy3>=2.0",
  "pymorphy3-dicts-uk>=2.4",
  # Recursive/markdown chunk boundaries are part of the index contract, so the splitter is a
  # pinned base dependency (never optional): the boundaries must be identical in CI and on the
  # CUDA host. Bump in lockstep with `_REQUIRED_TEXT_SPLITTERS` in llb/rag/chunking.py.
  "langchain-text-splitters==1.1.2",
  "numpy>=2.0",
]

[project.optional-dependencies]
# Installed on demand, e.g. `uv pip install -e ".[rag,track]"`. Kept out of the base
# install so `make venv` stays fast.
rag = [
  "faiss-cpu>=1.8",
  "scipy>=1.11",
  "sentence-transformers>=3.0",
  "deepeval>=4.0.6,<5",
]
# Second SCORING environment for the encoder/reranker bake-offs, never the shipped path. Four
# roster candidates ship their forward pass as repository code written against the transformers 4.x
# API (`llb.rag.encoders.model_stack`); on the pinned 5.x stack two raise at load and two load and return
# numbers that do not reproduce their own model card. This extra pins a transformers those
# repositories run on, beside the same sentence-transformers/torch, so those rows can be scored in
# a separate virtualenv (`make venv-encoders-legacy`) instead of being a hole in the ranking. It is
# self-contained rather than additive to [rag] because a single environment cannot hold two
# transformers majors -- hence the conflict declaration in [tool.uv] below.
encoders-legacy = [
  "transformers>=4.44,<5",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "scipy>=1.11",
  "einops>=0.8",  # the gte remote code imports it directly
  # The VRAM/power columns are half of a reranker recommendation, so the legacy pass has to be
  # able to report them too -- without these its footprint cells are blank and the two passes'
  # cost columns stop being comparable.
  "nvidia-ml-py>=12.0",
  "psutil>=5.9",
]
eval = ["langgraph>=0.2"]
crewai = ["crewai>=1.15,<2"]  # agentic harness comparison alt agentic harness (LangGraph vs CrewAI); validated on 1.15.0
# platform matrix alternative vector stores behind the RAG-store seam (FAISS stays the default in [rag]).
# Pinned because these clients have version-sensitive query/score APIs.
rag-chroma = ["chromadb==1.5.9"]
rag-qdrant = ["qdrant-client==1.18.0"]
rag-lancedb = ["lancedb==0.33.0"]
graph = ["duckdb>=1.0"]  # GraphRAG backend: persisted graph + recursive-CTE k-hop engine
# HFlow stays an opt-in integration input rather than a project dependency. The bridge itself reads
# its standard Parquet/MCAP boundaries with these format-native readers.
robotics = ["duckdb>=1.5.5", "mcap>=1.4.0"]
# Probabilistic record linkage (the identity seam under entity resolution). Splink supplies the
# Fellegi-Sunter engine on the DuckDB backend the graph store already requires, so this extra adds
# an engine, not a database. Upper bound: Splink 4 renamed the whole API surface this adapter is
# written against (namespaced `linker.training` / `.inference` / `.clustering`, `SettingsCreator`,
# `block_on`); a future major is a deliberate port, not a resolver decision.
linkage = ["splink>=4.0,<5", "duckdb>=1.0"]
# The OWL reasoner that CROSS-CHECKS the ontology axiom layer in CI. The shipped checker is pure
# Python over the typed models (`prep/ontology/axioms/`), so a scoring host never needs this; the
# reasoner exists to prove the checker did not invent its own semantics, and a disagreement is a
# bug in the checker. Never on the answer path.
ontology = ["rdflib>=7.0", "owlrl>=6.0"]
track = ["mlflow>=2.15", "duckdb>=1.0", "optuna>=3.6"]  # pyarrow arrives transitively via mlflow
board = ["streamlit>=1.36"]
viz = ["matplotlib>=3.8"]  # `recommend` model-comparison chart
prep = ["litellm>=1.40"]
telemetry = ["nvidia-ml-py>=12.0", "psutil>=5.9"]
review = ["textual>=0.60"]  # unified terminal workbench for all human review ledgers
# gguf backs the serve-adapter merge lane (convert_hf_to_gguf.py runs in this venv); prefer the
# llama.cpp checkout's own gguf-py (`make build-llamacpp` env) when versions ever disagree.
# bitsandbytes backs the trainer's default QLoRA 4-bit load path on CUDA hosts.
# unsloth (the optional `--trainer unsloth` fast path) is intentionally NOT listed here: like
# marker, it pins a hardware-matched torch/triton stack. Install `unsloth` manually in the CUDA
# training environment when selecting that trainer.
finetune = [
    "peft>=0.12",
    "trl>=0.9",
    "accelerate>=0.33",
    "datasets>=2.19",
    "optuna>=3.6",
    "gguf>=0.10",
    "bitsandbytes>=0.46.1",
]
goldset = ["datasets>=2.19"]  # only needed for `ingest_squad --hf-dataset`
cutoff = ["datasets>=2.19", "optuna>=3.6"]  # HF event loading + monotone cutoff fit
# only needed for `serve-tools-mcp` (tooling benchmark MCP transport). Upper bound: mcp 2.x
# REPLACED the low-level Server API `llb/bench/mcp_server.py` builds on (the `list_tools` /
# `call_tool` decorators are gone) and renamed `Tool.inputSchema`. The bound is what keeps a future
# `uv lock` from resolving a major this transport cannot serve; see the module docstring for the
# decision not to carry both.
mcp = ["mcp>=1.2,<2", "anyio>=4.0"]
# Optional high-quality PDF OCR/layout stack for CUDA transform hosts. Marker is intentionally
# not listed here because it pulls a hardware-matched torch stack; install `marker-pdf` in the
# dedicated CUDA transform environment when benchmarking it.
pdf-quality = ["docling[rapidocr]>=2.0", "markitdown[pdf]>=0.1", "unstructured[pdf]>=0.18"]
# NOTE: vLLM / torch / flash-attn are hardware-matched (host CUDA/GPU). `make venv`
# invokes scripts/build_vllm.sh on CUDA hosts, but they stay out of plain extras here.
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  # Contract exports are validated as an external consumer would validate them, without importing
  # llb. Keep the standards validator direct rather than relying on an unrelated extra to bring it.
  "jsonschema>=4.23",
  "textual>=0.60",
  # Upper bound: the formatter's output is version-sensitive, so a floating major would let a
  # release reformat the tree under CI. Lint rules are pinned by `[tool.ruff.lint].select`.
  "ruff>=0.6,<0.17",
  # The complexity gate's two scanners decide a HARD verdict, so both are exact. complexipy in
  # particular rescored this tree between 5.6.1 and 6.0.0 (`fetch_manifest` 11 -> 13,
  # `persist_run` 18 -> 14): the same commit failed the gate under one and passed under the other,
  # which is the split verdict a pinned linter exists to prevent. Upgrading either is a deliberate
  # edit: change the pin, refresh uv.lock, then run `make complexity-gate` plus `make ci`.
  "radon==6.0.1",
  "complexipy==6.0.0",
  # ShellCheck as a wheel (it bundles the real binary), so the shell-lint gate runs on every host
  # that can run `make ci` -- including GitHub CI, which installs no apt packages. Keep this exact
  # for the same reason as the scanners above; it also covers an install that bypasses uv.lock
  # (a direct `uv pip install -e ".[dev]"`), where a new ShellCheck can redden unchanged code.
  # To upgrade, change this pin, refresh uv.lock, then run the shell-lint gate and CI.
  "shellcheck-py==0.11.0.1",
  "pymarkdownlnt>=0.9.32",
  "optuna>=3.6",
  # Network-free robotics CI opens the committed Parquet and canonical MCAP fixture with standard
  # readers. HFlow itself is installed only by the explicit pinned integration Make target.
  "duckdb>=1.5.5",
  "mcap>=1.4.0",
]

[tool.uv]
conflicts = [
  # One environment cannot hold two transformers majors, and the legacy encoder pass exists
  # precisely to be the other one. Declaring the conflict is what keeps `uv lock` from resolving
  # the SHIPPED path down to transformers 4.x to satisfy both at once.
  [
    { extra = "rag" },
    { extra = "encoders-legacy" },
  ],
  [
    { extra = "crewai" },
    { extra = "encoders-legacy" },
  ],
  [
    { extra = "crewai" },
    { extra = "rag-chroma" },
  ],
  [
    { extra = "crewai" },
    { extra = "rag-lancedb" },
  ],
  [
    { extra = "crewai" },
    { extra = "dev" },
  ],
  [
    { extra = "crewai" },
    { extra = "rag" },
  ],
]

[project.scripts]
llb = "llb.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llb.prompts" = ["templates/**/*.txt", "templates/**/*.prompt.json", "templates/registry.json"]

[tool.ruff]
line-length = 100
target-version = "py313"  # restatement of [tool.llb.toolchain] python-version; make lint-toolchain joins them
# NOTE: no `cache-dir` here on purpose. A static path cannot read .env, so it would keep writing
# into the project root after an operator moved DATA_DIR. `make/config.mk` and
# `scripts/shared/common.sh` export RUFF_CACHE_DIR=$DATA_DIR/cache/ruff instead; a bare `ruff` with
# neither loaded uses its own gitignored `.ruff_cache/`.

# The lint contract is EXPLICIT, not ruff's default set. Ruff 0.16 widened that default (import
# sorting, pyupgrade, flake8-bugbear, implicit-concat, ...), which turned a clean tree into 1391
# findings on a CI box that resolved a newer ruff than the dev box -- a linter upgrade must not be
# able to fail CI on unchanged code. These four groups are the set this repo has always enforced
# (pycodestyle errors, pyflakes); widening it is a deliberate, separate decision.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pymarkdown]
# Enable GFM tables so the line-length rule (MD013) recognizes table rows as table tokens; without
# this extension pymarkdown parses a table as plain text and length-checks every (often wide) row.
extensions.markdown-tables.enabled = true
plugins.MD013.line_length = 100
plugins.MD013.code_block_line_length = 100  # the real key (was the ignored `code_line_length`)
plugins.MD013.heading_line_length = 100  # keep headings on the same 100-col budget as body text
plugins.MD013.tables = false  # do not length-check table rows (data tables are legitimately wide)
# House-style rules this repo deliberately diverges from -- disabled so `make lint-md` surfaces
# substantive issues, not style noise (re-enable any to tighten):
plugins.MD022.enabled = false  # blanks around headings (docs use a compact heading style)
plugins.MD032.enabled = false  # blanks around lists (docs use compact lists under an intro line)
plugins.MD024.enabled = false  # duplicate heading text (section names repeat across current-state topics)
plugins.MD040.enabled = false  # fenced-code language tag (plain command / shell fences)
plugins.MD004.enabled = false  # unordered-list marker style ("+" is used as a wrapped "plus" connector)
plugins.MD007.enabled = false  # nested-list indentation (compact nested lists)
plugins.MD026.enabled = false  # trailing punctuation in headings (sentence-style schema titles)

# Default interpreter minor and venv directory for `make venv`. Make, setup_venv.sh, and
# llb.build.toolchain read this table; mypy / ruff keys below must match it (`make ci` checks).
[tool.llb.toolchain]
python-version = "3.13"
venv = ".venv"

# Cursor's basedpyright language server does not inherit the Make/uv interpreter. Point it at
# [tool.llb.toolchain].venv so third-party imports resolve. Do not set pythonVersion: `make venv
# PYTHON_VERSION=` can change the interpreter in that directory, and a restated minor would lie.
[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.mypy]
python_version = "3.13"  # restatement of [tool.llb.toolchain] python-version; make lint-toolchain joins them
files = ["src/llb"]
# Cache dir: MYPY_CACHE_DIR=$DATA_DIR/cache/mypy, exported by make/config.mk and
# scripts/shared/common.sh -- see the ruff note above for why it is not a static path here.
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Cache dir: pytest has no cache env var, so `make` passes -o cache_dir=$DATA_DIR/cache/pytest
# (PYTEST_CACHE_OPT). A static path here could not follow a redirected DATA_DIR; a bare `pytest`
# uses its own gitignored `.pytest_cache/`.
# Pytest's default `norecursedirs` skips directories named `build`; keep this explicit list so
# `tests/llb/build/` can mirror `src/llb/build/` and still be collected.
norecursedirs = [".*", "__pycache__", ".eggs", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv"]
# DeepEval ships optional pytest integration and rerun plugins as runtime dependencies. The
# benchmark invokes metrics explicitly, so disable those global plugins in this test suite.
addopts = "-q -p no:deepeval -p no:rerunfailures"
# `sentencepiece` (pulled in transitively by transformers/sentence-transformers) ships a
# SWIG-generated C-extension whose helper types lack `__module__`, so CPython 3.13 emits
# "builtin type <Swig...> has no __module__ attribute" DeprecationWarnings at import and at
# interpreter shutdown. It is upstream SWIG code we cannot patch; ignore only that exact message
# so the suite stays warning-clean without masking our own deprecations.
filterwarnings = [
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
# Test groups (see Makefile `test` / `ci` / `ci-github`):
#   default / `make test`  -- the FULL suite, run locally; includes `slow` tests.
#   `make ci`              -- lightweight default-local suite; excludes `slow` and `opt_in_env`.
#   `make ci-github`       -- also excludes `heavy_env`; runs in
#                            the base `[dev]`-only install with no optional-dependency skips.
# Mark a test `@pytest.mark.slow` when it is intrinsically expensive (real Optuna sweeps,
# embedder/model loads, deepeval, subprocess builds) -- not merely a first-import artifact.
# Mark a test `@pytest.mark.heavy_env` when it is quick but needs an optional extra the base
# `[dev]` install lacks (faiss via `[rag]`, duckdb via `[graph]`, vector-store adapters).
# Mark a test `@pytest.mark.opt_in_env` when it needs an extra deliberately omitted even from the
# default local environment; regular CI deselects it instead of reporting a dependency skip.
# Mark a test `@pytest.mark.gpu_env` when it must touch the device (CUDA context, flashinfer JIT)
# and cannot be marked `slow`; both markers exempt it from the no-GPU guard that `tests/conftest.py`
# runs over every other test (llb.quality.gpu_guard.guard).
# Mark a test `@pytest.mark.network_env` when it must connect beyond loopback and cannot be marked
# `slow`; both markers exempt it from the no-download guard (llb.quality.download_guard).
markers = [
  "slow: long-running test, excluded from the lightweight `make ci` suite (run via `make test`)",
  "heavy_env: needs optional extras beyond the base [dev] install; deselected by `make ci-github` (GitHub CI), runs in local `make ci` / `make test`",
  "opt_in_env: needs an explicitly installed dependency omitted from regular local and GitHub CI; deselected by both CI suites",
  "gpu_env: legitimately initializes a CUDA context or imports flashinfer; exempt from the no-GPU guard on the non-slow tier",
  "network_env: legitimately connects beyond loopback; exempt from the no-download guard on the non-slow tier",
]
