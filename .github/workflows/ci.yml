# CI: format + lint + type checks + unit tests only.
#
# Deliberately lightweight -- it only checks that the code has no syntactic or logical
# errors. It installs the base package + the `dev` extra (mypy, ruff, pytest, the radon/complexipy
# and shellcheck gate tools, lightweight Optuna)
# and nothing else, so it never pulls heavy/eval deps (faiss, datasets, mlflow,
# sentence-transformers, torch/vLLM) and never runs an actual benchmark, model download, or GPU
# work.
#
# Install is `uv sync --locked`, so CI gets exactly the versions in uv.lock -- the same ones a
# local `make ci` runs against. The earlier `uv pip install -e ".[dev]"` re-resolved to whatever
# was newest on PyPI, which let CI fail on lint/type errors that no local venv could reproduce
# (e.g. a numpy minor bump changing an inferred dtype under mypy). `--locked` also fails fast if
# uv.lock has drifted from pyproject.toml -- refresh it with `uv lock` and commit the result.
#
# `make ci-github` runs the pytest group `-m "not slow and not heavy_env"`: intrinsically
# expensive tests carry `@pytest.mark.slow` (run only locally via `make test`), and quick tests
# that need optional extras absent here (faiss/duckdb/adapter stores) carry
# `@pytest.mark.heavy_env` (run locally via `make ci` / `make test`). Both groups are deselected
# explicitly, so this env runs with no optional-dependency skips. See docs/impl/current.md
# (Dev setup).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create venv (matrix Python) + install base + dev only, from uv.lock
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Format + lint + type checks + unit tests
        run: make ci-github
